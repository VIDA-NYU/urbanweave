[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "urbanweave"
dynamic = ["version"]
description = "Spatial integration for urban analysis: match sources to targets and aggregate their values, vector and grid."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Claudio Silva" }, { name = "New York University" }]
maintainers = [{ name = "OSCUR, VIDA-NYU" }]
keywords = ["spatial integration", "urban analytics", "gis", "h3", "raster", "zonal statistics", "openstreetmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
# The core: vector and H3 matching and aggregation.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "shapely>=2.0.4",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "h3>=4.1",
    "jupyterlab>=4.6.6",
    "ipykernel>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/VIDA-NYU/urbanweave"
Repository = "https://github.com/VIDA-NYU/urbanweave"
Issues = "https://github.com/VIDA-NYU/urbanweave/issues"
Documentation = "https://github.com/VIDA-NYU/urbanweave/tree/main/tutorials"
Design = "https://github.com/VIDA-NYU/urbanweave/blob/main/DESIGN.md"

[project.optional-dependencies]
# Zonal statistics and other raster paths.
raster = ["rasterio>=1.4", "exactextract>=0.2"]
# Street and intersection targets built from OpenStreetMap graphs.
osm = ["osmnx>=2.0", "networkx>=3.0"]
# Running the tutorial notebooks (tutorials/, executed by tools/run_tutorials.py).
tutorials = ["nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "tobler>=0.12",
    "rasterstats>=0.20",
]

[tool.hatch.version]
path = "src/urbanweave/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanweave"]

[tool.hatch.build.targets.sdist]
include = ["src/urbanweave", "tests", "examples", "README.md", "PLAN.md", "DESIGN.md", "STATUS.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "raster: needs the raster extra (rasterio, exactextract)",
    "osm: needs the osm extra (osmnx)",
    "legacy: compares with copied UrbanTrace or Curio code",
    "slow: larger comparisons and benchmarks, not run by default",
]
addopts = "-m 'not slow'"
filterwarnings = ["error::FutureWarning:urbanweave"]
